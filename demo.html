<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kastel Markup Demo</title>
</head>

<body>
    <h2 id="kastel-markup">Kastel Markup</h2>
    <p>Bienvenue dans <strong>Kastel Markup</strong>.</p>
    <ul>
        <li>Lexer</li>
        <li>Parser</li>
        <li>AST</li>
    </ul>
    <blockquote>
        <p>Un document déterministe.</p>
    </blockquote>
    <table>
        <thead>
            <tr>
                <th>Fonctionnalité</th>
                <th>Statut</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Lexer</td>
                <td>OK</td>
            </tr>
            <tr>
                <td>Parser</td>
                <td>OK</td>
            </tr>
            <tr>
                <td>HTML</td>
                <td>OK</td>
            </tr>
        </tbody>
    </table>
    <pre><code class="language-rust">fn main() {
        println!(&quot;Hello, Kastel!&quot;);
    }
    </code></pre>
    <div class="custom-block custom-note">
        <p>Le renderer HTML est indépendant du parser.</p>
    </div>
</body>

</html>
